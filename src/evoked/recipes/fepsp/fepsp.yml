experiment:
  name: Hippocampus fEPSP experiment
  description: Matched-filter detection of FV/fEPSP/PS

analysis:
  epoch: [0.0,0.025]
  features:
    Fiber Volley:
      window: [0.00125, 0.003]
      algorithm:
        method: matched_filter

    fEPSP:
      window: [0.0025, 0.00425]
      algorithm:
        method: matched_filter
        derivative_transform: true

    Population Spike:
      window: [0.005, 0.0075]
      algorithm:
        method: matched_filter